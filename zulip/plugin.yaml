name: zulip
label: Zulip
kind: platform
version: 1.0.0
description: Zulip gateway adapter for Hermes Agent. Supports streams with topics and private messages.
author: Niyaz
requires_env:
  - name: ZULIP_API_KEY
    description: "Bot API key from Zulip Settings → Bots"
    prompt: "Zulip bot API key"
    url: "https://zulipchat.com/help/add-a-bot"
    password: true
  - name: ZULIP_EMAIL
    description: "Bot email address (e.g. hermes-bot@your-org.zulipchat.com)"
    prompt: "Zulip bot email"
  - name: ZULIP_SITE
    description: "Zulip organization URL (e.g. https://your-org.zulipchat.com)"
    prompt: "Zulip site URL"
optional_env:
  - name: ZULIP_HOME_CHANNEL
    description: "Default stream ID for cron deliveries"
    prompt: "Home stream ID"
  - name: ZULIP_HOME_CHANNEL_NAME
    description: "Default topic for cron deliveries"
    prompt: "Home topic"
  - name: ZULIP_ALLOWED_USERS
    description: "Comma-separated emails allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
  - name: ZULIP_EDIT_PLACEHOLDER
    description: 'Send "Thinking..." placeholder then edit with final response (default: true, set false to disable)'
    prompt: "Enable placeholder editing"
  - name: ZULIP_REACTIONS_ENABLED
    description: "Enable emoji reaction status indicators (default: true)"
    prompt: "Enable reactions"
  - name: ZULIP_REACTION_CLEAR_ON_FINISH
    description: "Remove 'working' reaction when done (default: true)"
    prompt: "Clear reactions on finish"
  - name: ZULIP_REACTION_START
    description: "Emoji while processing (default: eyes)"
    prompt: "Start reaction emoji"
  - name: ZULIP_REACTION_SUCCESS
    description: "Emoji on success (default: check_mark)"
    prompt: "Success reaction emoji"
  - name: ZULIP_REACTION_ERROR
    description: "Emoji on error (default: warning)"
    prompt: "Error reaction emoji"
  - name: ZULIP_TEXT_CHUNK_LIMIT
    description: "Max chars per outbound message (default: 10000)"
    prompt: "Text chunk limit"
  - name: ZULIP_CHUNK_MODE
    description: 'Chunking mode: "length" or "newline" (default: length)'
    prompt: "Chunk mode"
  - name: ZULIP_MEDIA_MAX_MB
    description: "Max inbound attachment size in MB (default: 5)"
    prompt: "Media max size (MB)"
  - name: ZULIP_CHATMODE
    description: 'Stream trigger mode: "onmessage", "oncall", "onchar" (default: onmessage)'
    prompt: "Chat mode"
  - name: ZULIP_ONCHAR_PREFIXES
    description: 'Trigger prefixes for onchar mode (default: >,!)'
    prompt: "Onchar prefixes"
  - name: ZULIP_REQUIRE_MENTION
    description: "Require @mention in streams (default: true)"
    prompt: "Require mention"
  - name: ZULIP_ENGAGEMENT_MODE
    description: 'Sticky follow-ups after @mention: "sticky_topic" (default) or "off"'
    prompt: "Engagement mode"
  - name: ZULIP_ENGAGEMENT_SCOPE
    description: 'Who can continue without @mention: "user" (default, same person) or "topic" (anyone in topic)'
    prompt: "Engagement scope"
  - name: ZULIP_ENGAGEMENT_TTL_MINUTES
    description: "Minutes of idle time before sticky engagement expires (default: 45)"
    prompt: "Engagement TTL minutes"
  - name: ZULIP_FREE_RESPONSE_STREAMS
    description: "Comma-separated stream IDs that never require @mention"
    prompt: "Free-response stream IDs"
  - name: ZULIP_ENGAGEMENT_EXPIRY_NOTICE
    description: "Post a topic notice when sticky engagement idle-expires (default: true)"
    prompt: "Engagement expiry notice"
  - name: ZULIP_ENGAGEMENT_EXPIRY_SCAN_SECONDS
    description: "How often to scan for expired engagements (default: 30)"
    prompt: "Expiry scan interval seconds"
